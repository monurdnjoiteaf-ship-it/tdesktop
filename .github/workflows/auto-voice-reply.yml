name: Build Telegram Auto Voice Reply

on:
  workflow_dispatch:
  push:
    branches:
      - feature/auto-voice-reply-assistant
    paths:
      - TelegramAutoVoiceReply/**
      - .github/workflows/auto-voice-reply.yml

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r TelegramAutoVoiceReply/requirements.txt

      - name: Build executable
        shell: pwsh
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Telegram-Auto-Voice-Reply
          --collect-all imageio_ffmpeg
          TelegramAutoVoiceReply/app.py

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/Telegram-Auto-Voice-Reply.exe -DestinationPath Telegram-Auto-Voice-Reply-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Telegram Auto Voice Reply x64
          path: Telegram-Auto-Voice-Reply-x64.zip
          retention-days: 7
